<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GCC ICT Intelligence OS</title>
  <meta name="description" content="Weekly GCC ICT intelligence brief web app for consulting, archiving, and reviewing strategic signals." />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />
  <style>
    :root, [data-theme="light"] {
      --font-body: 'Satoshi', Inter, sans-serif;
      --font-display: 'Satoshi', Inter, sans-serif;
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
      --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2rem);
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem; --space-10: 2.5rem; --space-12: 3rem;
      --color-bg: #f7f6f2; --color-surface: #f9f8f5; --color-surface-2: #fbfbf9; --color-surface-offset: #f3f0ec; --color-border: #d4d1ca; --color-divider: #dcd9d5;
      --color-text: #28251d; --color-text-muted: #7a7974; --color-text-faint: #bab9b4; --color-text-inverse: #f9f8f4;
      --color-primary: #01696f; --color-primary-hover: #0c4e54; --color-primary-highlight: #cedcd8;
      --color-success: #437a22; --color-warning: #964219; --color-error: #a12c7b; --color-blue: #006494;
      --radius-sm: 0.375rem; --radius-md: 0.5rem; --radius-lg: 0.75rem; --radius-xl: 1rem; --radius-full: 9999px;
      --shadow-sm: 0 1px 2px rgb(30 26 22 / 0.06); --shadow-md: 0 4px 12px rgb(30 26 22 / 0.08); --shadow-lg: 0 12px 32px rgb(30 26 22 / 0.12);
      --content-wide: 1240px;
      --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    [data-theme="dark"] {
      --color-bg: #171614; --color-surface: #1c1b19; --color-surface-2: #201f1d; --color-surface-offset: #22211f; --color-border: #393836; --color-divider: #262523;
      --color-text: #cdccca; --color-text-muted: #979591; --color-text-faint: #6a6864; --color-text-inverse: #2b2a28;
      --color-primary: #4f98a3; --color-primary-hover: #227f8b; --color-primary-highlight: #313b3b;
      --color-success: #6daa45; --color-warning: #bb653b; --color-error: #d163a7; --color-blue: #5591c7;
      --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.2); --shadow-md: 0 4px 12px rgb(0 0 0 / 0.3); --shadow-lg: 0 12px 32px rgb(0 0 0 / 0.4);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body, sans-serif);
      font-size: var(--text-base);
      line-height: 1.55;
      color: var(--color-text);
      background: var(--color-bg);
    }
    a { color: inherit; }
    button, select { font: inherit; color: inherit; }
    .app {
      min-height: 100dvh;
      display: grid;
      grid-template-columns: 300px 1fr;
      background: linear-gradient(180deg, color-mix(in srgb, var(--color-primary) 4%, var(--color-bg)), var(--color-bg) 12rem);
    }
    .sidebar {
      position: sticky;
      top: 0;
      align-self: start;
      height: 100dvh;
      overflow-y: auto;
      padding: var(--space-6);
      border-right: 1px solid color-mix(in srgb, var(--color-text) 12%, transparent);
      background: color-mix(in srgb, var(--color-surface) 92%, transparent);
      backdrop-filter: blur(10px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-8);
    }
    .brand-mark {
      width: 40px; height: 40px; border-radius: 12px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, var(--color-primary-highlight), color-mix(in srgb, var(--color-primary) 18%, var(--color-surface)));
      color: var(--color-primary);
      box-shadow: var(--shadow-sm);
      flex: 0 0 auto;
    }
    .brand h1 { font-size: var(--text-base); line-height: 1.2; margin: 0; }
    .brand p, .meta-note, .small { margin: 0; color: var(--color-text-muted); font-size: var(--text-xs); }
    .side-group { margin-bottom: var(--space-8); }
    .side-group h2 {
      margin: 0 0 var(--space-3);
      font-size: var(--text-xs);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-text-muted);
    }
    .brief-list { display: grid; gap: var(--space-2); }
    .brief-button, .ghost-button, .theme-toggle {
      width: 100%; text-align: left; border: 1px solid transparent; border-radius: var(--radius-lg);
      padding: 0.8rem 0.95rem; background: transparent; transition: all var(--transition);
    }
    .brief-button:hover, .ghost-button:hover, .theme-toggle:hover {
      background: var(--color-surface-offset);
      border-color: color-mix(in srgb, var(--color-text) 10%, transparent);
    }
    .brief-button.active {
      background: color-mix(in srgb, var(--color-primary) 10%, var(--color-surface));
      border-color: color-mix(in srgb, var(--color-primary) 24%, transparent);
    }
    .brief-button strong { display: block; font-size: var(--text-sm); }
    .brief-button span { display: block; color: var(--color-text-muted); font-size: var(--text-xs); }
    .main {
      padding: var(--space-6);
    }
    .topbar {
      display: flex; gap: var(--space-4); align-items: center; justify-content: space-between;
      margin: 0 auto var(--space-6); max-width: var(--content-wide);
    }
    .toolbar {
      display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap;
    }
    .theme-toggle, .ghost-button {
      width: auto;
      background: var(--color-surface);
      border: 1px solid color-mix(in srgb, var(--color-text) 10%, transparent);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
    }
    .layout {
      max-width: var(--content-wide);
      margin: 0 auto;
      display: grid;
      gap: var(--space-6);
    }
    .hero {
      display: grid;
      grid-template-columns: 1.4fr 0.9fr;
      gap: var(--space-6);
      align-items: stretch;
    }
    .panel {
      background: color-mix(in srgb, var(--color-surface) 95%, transparent);
      border: 1px solid color-mix(in srgb, var(--color-text) 10%, transparent);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
      padding: var(--space-6);
    }
    .hero-card {
      display: grid;
      gap: var(--space-5);
      min-height: 260px;
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: var(--space-2);
      width: fit-content;
      font-size: var(--text-xs);
      color: var(--color-primary);
      padding: 0.4rem 0.7rem;
      border-radius: var(--radius-full);
      background: color-mix(in srgb, var(--color-primary) 11%, var(--color-surface));
      border: 1px solid color-mix(in srgb, var(--color-primary) 18%, transparent);
    }
    .hero-title { margin: 0; font-size: var(--text-xl); line-height: 1.04; letter-spacing: -0.03em; }
    .hero-summary { margin: 0; color: var(--color-text-muted); max-width: 64ch; }
    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-4);
    }
    .stat {
      background: var(--color-surface-2);
      border: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
    }
    .stat-label { font-size: var(--text-xs); color: var(--color-text-muted); margin-bottom: 0.25rem; }
    .stat-value { font-size: 1.65rem; line-height: 1; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
    .hero-side {
      display: grid; gap: var(--space-4);
      align-content: start;
    }
    .section-grid {
      display: grid;
      grid-template-columns: 1.3fr 0.9fr;
      gap: var(--space-6);
    }
    .section-title {
      margin: 0 0 var(--space-4);
      font-size: var(--text-lg);
      letter-spacing: -0.02em;
    }
    .signal-list, .pulse-list, .deal-list, .implication-list, .source-list { display: grid; gap: var(--space-4); }
    .signal-card, .mini-card {
      background: var(--color-surface-2);
      border: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
    }
    .signal-top, .item-top {
      display: flex; gap: var(--space-3); align-items: flex-start; justify-content: space-between; flex-wrap: wrap;
      margin-bottom: var(--space-3);
    }
    .signal-card h3, .mini-card h3, .mini-card h4 { margin: 0; font-size: 1.05rem; line-height: 1.25; }
    .muted { color: var(--color-text-muted); }
    .chips { display: flex; gap: var(--space-2); flex-wrap: wrap; }
    .chip {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-size: var(--text-xs); padding: 0.32rem 0.62rem; border-radius: var(--radius-full);
      border: 1px solid color-mix(in srgb, var(--color-text) 10%, transparent);
      background: var(--color-surface);
      color: var(--color-text-muted);
    }
    .chip.critical { background: color-mix(in srgb, var(--color-error) 10%, var(--color-surface)); color: var(--color-error); border-color: color-mix(in srgb, var(--color-error) 20%, transparent); }
    .chip.watch { background: color-mix(in srgb, var(--color-warning) 10%, var(--color-surface)); color: var(--color-warning); border-color: color-mix(in srgb, var(--color-warning) 20%, transparent); }
    .chip.opportunity { background: color-mix(in srgb, var(--color-success) 10%, var(--color-surface)); color: var(--color-success); border-color: color-mix(in srgb, var(--color-success) 20%, transparent); }
    .chip.info { background: color-mix(in srgb, var(--color-blue) 10%, var(--color-surface)); color: var(--color-blue); border-color: color-mix(in srgb, var(--color-blue) 18%, transparent); }
    .signal-card p, .mini-card p, .mini-card li { margin: 0; }
    .signal-copy { display: grid; gap: var(--space-3); }
    .source-list a {
      display: inline-flex; align-items: center; gap: 0.35rem; text-decoration: none;
      color: var(--color-primary);
    }
    .source-list a:hover { color: var(--color-primary-hover); }
    .kpi-line { display: flex; justify-content: space-between; gap: var(--space-4); align-items: baseline; }
    .divider { height: 1px; background: var(--color-divider); margin: var(--space-4) 0; }
    .empty, .error-state {
      border-radius: var(--radius-xl);
      padding: var(--space-10);
      border: 1px dashed color-mix(in srgb, var(--color-text) 16%, transparent);
      background: var(--color-surface);
      color: var(--color-text-muted);
      text-align: center;
    }
    .footer-note {
      color: var(--color-text-muted);
      font-size: var(--text-xs);
      margin-top: var(--space-6);
      text-align: right;
    }
    .mobile-bar { display: none; }
    .hidden { display: none !important; }
    @media (max-width: 1100px) {
      .app { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed; inset: 0 auto 0 0; width: min(88vw, 320px); z-index: 30;
        transform: translateX(-101%); transition: transform var(--transition);
        box-shadow: var(--shadow-lg);
      }
      .sidebar.open { transform: translateX(0); }
      .main { padding-top: var(--space-4); }
      .mobile-bar {
        display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
        max-width: var(--content-wide); margin: 0 auto var(--space-4);
      }
      .hero, .section-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 720px) {
      .main, .sidebar { padding: var(--space-4); }
      .stats { grid-template-columns: 1fr; }
      .topbar { display: none; }
      .panel { padding: var(--space-4); }
      .signal-top, .item-top, .kpi-line { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <a class="sr-only" href="#main">Skip to content</a>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-label="GCC ICT Intelligence OS logo">
            <path d="M4 17.5V6.5l8-3 8 3v11l-8 3-8-3Z"></path>
            <path d="M12 3.5v17"></path>
            <path d="M4 6.5 12 10l8-3.5"></path>
          </svg>
        </div>
        <div>
          <h1>GCC ICT Intelligence OS</h1>
          <p>Weekly intelligence dashboard</p>
        </div>
      </div>

      <div class="side-group">
        <h2>Archive</h2>
        <div class="brief-list" id="briefList"></div>
      </div>

      <div class="side-group">
        <h2>Data</h2>
        <button class="ghost-button" id="openJsonButton">Open active JSON</button>
      </div>

      <div class="side-group">
        <h2>Display</h2>
        <button class="theme-toggle" data-theme-toggle id="themeToggle">Toggle theme</button>
      </div>

      <p class="meta-note">Designed for weekly consultation, signal triage, and archive review from GitHub Pages.</p>
    </aside>

    <main class="main" id="main">
      <div class="mobile-bar">
        <button class="ghost-button" id="menuButton">Archive</button>
        <button class="theme-toggle" id="mobileThemeToggle">Theme</button>
      </div>

      <div class="topbar">
        <div>
          <div class="eyebrow">Strategic signal monitor</div>
        </div>
        <div class="toolbar">
          <button class="theme-toggle" id="desktopThemeToggle">Theme</button>
          <button class="ghost-button" id="refreshButton">Refresh view</button>
        </div>
      </div>

      <div id="appContent" class="layout">
        <div class="panel empty">Loading weekly brief…</div>
      </div>
    </main>
  </div>

  <script>
    const state = {
      theme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light',
      index: null,
      briefs: [],
      activeFile: null,
      activeBrief: null,
      dataBasePath: './data/briefs/',
    };

    const appContent = document.getElementById('appContent');
    const briefList = document.getElementById('briefList');
    const sidebar = document.getElementById('sidebar');

    function applyTheme(theme) {
      state.theme = theme;
      document.documentElement.setAttribute('data-theme', theme);
    }

    applyTheme(state.theme);

    function toggleTheme() {
      applyTheme(state.theme === 'dark' ? 'light' : 'dark');
    }

    document.getElementById('themeToggle').addEventListener('click', toggleTheme);
    document.getElementById('desktopThemeToggle').addEventListener('click', toggleTheme);
    document.getElementById('mobileThemeToggle').addEventListener('click', toggleTheme);
    document.getElementById('menuButton').addEventListener('click', () => sidebar.classList.toggle('open'));
    document.getElementById('refreshButton').addEventListener('click', () => loadIndexAndBrief(true));
    document.getElementById('openJsonButton').addEventListener('click', () => {
      if (!state.activeFile) return;
      window.open(state.dataBasePath + state.activeFile, '_blank', 'noopener,noreferrer');
    });

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function formatDate(dateString) {
      if (!dateString) return 'Unknown date';
      const d = new Date(dateString);
      if (Number.isNaN(d.getTime())) return dateString;
      return new Intl.DateTimeFormat('en-GB', { year: 'numeric', month: 'short', day: 'numeric' }).format(d);
    }

    function chip(label, cls = '') {
      return `<span class="chip ${cls}">${escapeHtml(label)}</span>`;
    }

    function renderArchive() {
      if (!state.briefs.length) {
        briefList.innerHTML = '<div class="small muted">No archived briefs found.</div>';
        return;
      }
      briefList.innerHTML = state.briefs.map(file => {
        const active = file === state.activeFile ? 'active' : '';
        const dateLabel = file.replace('.json', '');
        return `
          <button class="brief-button ${active}" data-file="${escapeHtml(file)}">
            <strong>${escapeHtml(formatDate(dateLabel))}</strong>
            <span>${escapeHtml(file)}</span>
          </button>`;
      }).join('');

      briefList.querySelectorAll('[data-file]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const file = btn.getAttribute('data-file');
          if (!file) return;
          sidebar.classList.remove('open');
          await loadBrief(file);
        });
      });
    }

    function renderError(message) {
      appContent.innerHTML = `<div class="error-state"><h2>Unable to load brief</h2><p>${escapeHtml(message)}</p><p class="small">Check that ./data/briefs/index.json exists and that your JSON files are committed to the Pages branch.</p></div>`;
    }

    function renderBrief(brief) {
      const topSignals = Array.isArray(brief.top_signals) ? brief.top_signals : [];
      const demandPulse = Array.isArray(brief.demand_pulse) ? brief.demand_pulse : [];
      const deals = Array.isArray(brief.deals_and_partnerships) ? brief.deals_and_partnerships : [];
      const implications = Array.isArray(brief.implications) ? brief.implications : [];
      const contrarian = brief.contrarian_view || {};

      appContent.innerHTML = `
        <section class="hero">
          <article class="panel hero-card">
            <div class="eyebrow">Weekly brief · ${escapeHtml(formatDate(brief.date))}</div>
            <div>
              <h2 class="hero-title">${escapeHtml(brief.title || 'GCC ICT Intelligence Brief')}</h2>
            </div>
            <p class="hero-summary">${escapeHtml(brief.executive_summary || 'No executive summary available.')}</p>
            <div class="stats">
              <div class="stat">
                <div class="stat-label">Top signals</div>
                <div class="stat-value">${topSignals.length}</div>
              </div>
              <div class="stat">
                <div class="stat-label">Demand pulse items</div>
                <div class="stat-value">${demandPulse.length}</div>
              </div>
              <div class="stat">
                <div class="stat-label">Deals watched</div>
                <div class="stat-value">${deals.length}</div>
              </div>
              <div class="stat">
                <div class="stat-label">Generated</div>
                <div class="stat-value" style="font-size:1rem;line-height:1.3">${escapeHtml(formatDate(brief.generated_at || brief.date))}</div>
              </div>
            </div>
          </article>

          <aside class="hero-side">
            <section class="panel">
              <h3 class="section-title">Contrarian view</h3>
              <div class="mini-card">
                <p>${escapeHtml(contrarian.thesis || 'No contrarian thesis provided.')}</p>
                ${contrarian.consensus_view ? `<div class="divider"></div><p class="muted"><strong>Consensus:</strong> ${escapeHtml(contrarian.consensus_view)}</p>` : ''}
                ${Array.isArray(contrarian.what_to_watch) && contrarian.what_to_watch.length ? `<div class="divider"></div><div class="chips">${contrarian.what_to_watch.map(item => chip(item, 'info')).join('')}</div>` : ''}
              </div>
            </section>

            <section class="panel">
              <h3 class="section-title">Meta</h3>
              <div class="mini-card">
                <div class="kpi-line"><span class="muted">Synthesis model</span><strong>${escapeHtml(brief.meta?.model_synthesis || 'n/a')}</strong></div>
                <div class="divider"></div>
                <div class="kpi-line"><span class="muted">Discovery queries</span><strong>${escapeHtml(String(brief.meta?.discovery_query_count ?? '0'))}</strong></div>
                <div class="divider"></div>
                <div class="kpi-line"><span class="muted">Raw signals reviewed</span><strong>${escapeHtml(String(brief.meta?.raw_signal_count ?? '0'))}</strong></div>
              </div>
            </section>
          </aside>
        </section>

        <section class="section-grid">
          <section class="panel">
            <h3 class="section-title">Top signals</h3>
            <div class="signal-list">
              ${topSignals.length ? topSignals.map(signal => `
                <article class="signal-card">
                  <div class="signal-top">
                    <h3>${escapeHtml(signal.headline || 'Untitled signal')}</h3>
                    <div class="chips">
                      ${chip(signal.signal_type || 'watch', signal.signal_type || '')}
                      ${(signal.domains || []).slice(0, 3).map(d => chip(d)).join('')}
                    </div>
                  </div>
                  <div class="signal-copy">
                    <p>${escapeHtml(signal.summary || '')}</p>
                    <p><strong>Why it matters:</strong> ${escapeHtml(signal.why_it_matters || '')}</p>
                    <div class="chips">
                      ${(signal.layers || []).map(l => chip(l, 'info')).join('')}
                      ${(signal.geography || []).map(g => chip(g)).join('')}
                    </div>
                    <div class="source-list">
                      ${(signal.sources || []).map(src => `<a href="${escapeHtml(src.url)}" target="_blank" rel="noopener noreferrer">↗ ${escapeHtml(src.title || src.url)}</a>`).join('')}
                    </div>
                  </div>
                </article>`).join('') : '<div class="empty">No top signals found in this brief.</div>'}
            </div>
          </section>

          <aside class="panel">
            <h3 class="section-title">Implications</h3>
            <div class="implication-list">
              ${implications.length ? implications.map(item => `
                <article class="mini-card">
                  <div class="item-top">
                    <h4>${escapeHtml(item.audience || 'Executive')}</h4>
                    ${chip(item.horizon || 'now', 'info')}
                  </div>
                  <p>${escapeHtml(item.recommendation || '')}</p>
                </article>`).join('') : '<div class="empty">No implications provided.</div>'}
            </div>
          </aside>
        </section>

        <section class="section-grid">
          <section class="panel">
            <h3 class="section-title">Demand pulse</h3>
            <div class="pulse-list">
              ${demandPulse.length ? demandPulse.map(item => `
                <article class="mini-card">
                  <div class="item-top">
                    <h4>${escapeHtml(item.segment || 'Segment')}</h4>
                    ${chip(item.trajectory || 'unclear', 'info')}
                  </div>
                  <p>${escapeHtml(item.evidence || '')}</p>
                  ${(item.sources || []).length ? `<div class="divider"></div><div class="source-list">${item.sources.map(src => `<a href="${escapeHtml(src.url)}" target="_blank" rel="noopener noreferrer">↗ ${escapeHtml(src.title || src.url)}</a>`).join('')}</div>` : ''}
                </article>`).join('') : '<div class="empty">No demand pulse items in this brief.</div>'}
            </div>
          </section>

          <section class="panel">
            <h3 class="section-title">Deals & partnerships</h3>
            <div class="deal-list">
              ${deals.length ? deals.map(item => `
                <article class="mini-card">
                  <div class="item-top">
                    <h4>${escapeHtml(item.headline || item.type || 'Deal')}</h4>
                    ${chip(item.type || 'Partnership')}
                  </div>
                  ${(item.parties || []).length ? `<p class="muted">${escapeHtml(item.parties.join(' · '))}</p>` : ''}
                  ${item.value_or_scope ? `<p>${escapeHtml(item.value_or_scope)}</p>` : ''}
                  ${(item.sources || []).length ? `<div class="divider"></div><div class="source-list">${item.sources.map(src => `<a href="${escapeHtml(src.url)}" target="_blank" rel="noopener noreferrer">↗ ${escapeHtml(src.title || src.url)}</a>`).join('')}</div>` : ''}
                </article>`).join('') : '<div class="empty">No deals or partnerships in this brief.</div>'}
            </div>
          </section>
        </section>

        <p class="footer-note">Archive-aware weekly reader for GitHub Pages · active file: ${escapeHtml(state.activeFile || 'n/a')}</p>
      `;
    }

    async function loadBrief(file) {
      state.activeFile = file;
      renderArchive();
      appContent.innerHTML = '<div class="panel empty">Loading selected brief…</div>';
      try {
        const response = await fetch(state.dataBasePath + file, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status} while loading ${file}`);
        const brief = await response.json();
        state.activeBrief = brief;
        renderBrief(brief);
      } catch (error) {
        renderError(error.message || 'Unknown error while loading brief.');
      }
    }

    async function loadIndexAndBrief(force = false) {
      try {
        if (!state.index || force) {
          const response = await fetch(state.dataBasePath + 'index.json', { cache: 'no-store' });
          if (!response.ok) throw new Error('Could not load data/briefs/index.json');
          state.index = await response.json();
          state.briefs = Array.isArray(state.index.files) ? state.index.files.slice().sort().reverse() : [];
        }
        if (!state.briefs.length) throw new Error('index.json loaded but contained no files array.');
        renderArchive();
        const fileToLoad = state.activeFile && state.briefs.includes(state.activeFile) ? state.activeFile : state.briefs[0];
        await loadBrief(fileToLoad);
      } catch (error) {
        renderError(error.message || 'Unknown archive loading error.');
      }
    }

    loadIndexAndBrief();
  </script>
</body>
</html>
