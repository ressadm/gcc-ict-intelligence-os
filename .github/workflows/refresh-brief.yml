name: Refresh weekly brief on schedule


on:
  schedule:
    # 05:00 UTC every Monday (08:00 Riyadh / KSA, GMT+3).
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      date:
        description: 'Override date (YYYY-MM-DD). Leave blank for today UTC.'
        required: false

permissions:
  contents: write

concurrency:
  group: refresh-brief
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Preflight — verify PERPLEXITY_API_KEY is configured
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: |
          if [ -z "${PERPLEXITY_API_KEY}" ]; then
            echo "::error title=Missing repository secret::PERPLEXITY_API_KEY is not set. Add it under Settings → Secrets and variables → Actions → New repository secret (name: PERPLEXITY_API_KEY). See README → Secrets / environment."
            exit 1
          fi
          echo "PERPLEXITY_API_KEY is present."

      - name: Run brief refresh
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          REFRESH_DATE: ${{ inputs.date }}
        run: npm run refresh-brief

      - name: Validate all briefs
        run: npm run validate-briefs

      - name: Commit & push if changed
        run: |
          git config user.name "gcc-ict-intelligence-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/briefs data/status
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          DATE_TAG=$(date -u +%Y-%m-%d)
          git commit -m "brief: refresh ${DATE_TAG}"
          git push

      - name: Surface error file on failure
        if: failure()
        run: |
          if [ -f data/status/latest-error.json ]; then
            echo "::group::latest-error.json"
            cat data/status/latest-error.json
            echo "::endgroup::"
          fi
